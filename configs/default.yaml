# 預設設定範例。
#
# 重要：Phase 2 的實際執行設定仍以 pydantic-settings 為準，
# 讀取順序為「系統環境變數 -> .env -> app/core/config.py 的預設值」。
# 本 YAML 尚未接入程式執行流程，目前僅作為參數設計的整體參考。
# 若要調整實際行為，請修改 .env（可從 .env.example 複製）。

app:
  name: Medical Local RAG
  version: 0.1.0
  env: development
  log_level: INFO

# 資料目錄（已在 Phase 2 接入，實際值由 .env 的 RAW_DATA_DIR / PROCESSED_DATA_DIR 決定）
data:
  raw_dir: data/raw
  processed_dir: data/processed

# 上傳限制（已在 Phase 2 接入，實際值由 .env 的 MAX_UPLOAD_SIZE_MB 決定）
upload:
  max_size_mb: 20
  allowed_extensions:
    - .txt
    - .pdf
    - .docx

# 切塊參數（已在 Phase 2 接入，實際值由 .env 決定）
# 單位為「字元數」，不是 token。token 計量要等 Phase 3 引入實際 tokenizer 後才有意義。
chunking:
  chunk_size: 500
  chunk_overlap: 100
  min_chunk_size: 50

# --- Phase 3（實際值由 .env / pydantic-settings 決定）---

embedding:
  provider: local
  model_name: intfloat/multilingual-e5-small
  model_revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  device: cpu
  batch_size: 32

vector_store:
  provider: chroma
  db_dir: vector_db
  collection_name: medical_documents

# --- Phase 4（實際值由 .env / pydantic-settings 決定）---

retrieval:
  # 未指定 top_k 時的預設回傳筆數。
  top_k: 5
  # 允許的 top_k 上限；超過會回 HTTP 400 而不是靜默截斷。
  max_top_k: 50

llm:
  provider: openai_compatible
  base_url: http://127.0.0.1:8001/v1
  model_name: local-medical-model
  temperature: 0.0
  max_tokens: 512
  timeout: 60.0
  allow_private_network: false
