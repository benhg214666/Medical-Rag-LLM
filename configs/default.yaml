# 預設設定範例（Phase 1 尚未接入程式執行流程）。
#
# 目前程式實際讀取的設定來源是「系統環境變數 -> .env -> config.py 預設值」。
# 這個 YAML 只是先把未來各子系統會用到的參數列出來，方便設計與討論，
# 等到對應功能實作時，才會加入真正的 YAML loader。

app:
  name: Medical Local RAG
  version: 0.1.0

chunking:
  chunk_size: 500
  chunk_overlap: 100

retrieval:
  top_k: 5

embedding:
  provider: local
  model_name: null

llm:
  backend: local
  model_name: null

vector_store:
  provider: chroma
  persist_directory: vector_db
